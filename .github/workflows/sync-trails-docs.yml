name: Sync Trails Docs

# Manually triggered import of the documentation from open-pioneer/trails-starter
# into this Astro/Starlight site. The transformation is performed by
# site_astro/scripts/import-trails-docs.mjs and the result is delivered as a
# pull request against main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit SHA of open-pioneer/trails-starter to import"
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-trails-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout trails-starter docs
        uses: actions/checkout@v4
        with:
          repository: open-pioneer/trails-starter
          ref: ${{ inputs.ref }}
          path: .trails-src
          sparse-checkout: docs

      - name: Resolve source commit
        id: src
        run: echo "sha=$(git -C .trails-src rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site_astro/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site_astro
        run: pnpm install --frozen-lockfile

      - name: Import & transform docs
        working-directory: site_astro
        run: node scripts/import-trails-docs.mjs "$GITHUB_WORKSPACE/.trails-src/docs"

      - name: Validate Astro build
        working-directory: site_astro
        run: pnpm build

      - name: Remove source checkout
        run: rm -rf .trails-src

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: site_astro/src/content/docs/trails-docs
          branch: docs/sync-trails-starter
          delete-branch: true
          base: main
          commit-message: "docs: sync trails docs from ${{ inputs.ref }}@${{ steps.src.outputs.sha }}"
          title: "docs: sync Trails docs (${{ inputs.ref }})"
          body: |
            Automated import of the Trails documentation.

            - **Source:** [`open-pioneer/trails-starter`](https://github.com/open-pioneer/trails-starter) @ `${{ inputs.ref }}` (`${{ steps.src.outputs.sha }}`)
            - Generated by `.github/workflows/sync-trails-docs.yml` via `site_astro/scripts/import-trails-docs.mjs`
            - The Astro build was validated in CI.

            Review the diff under `site_astro/src/content/docs/trails-docs/` before merging.
            If a **top-level** document was added/renamed/removed, the sidebar in
            `site_astro/astro.config.mjs` may need a manual adjustment.
